<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Toy dəvətnaməsi</title>
    <meta property="og:title" content="Toy dəvətnaməsi">
    <meta property="og:description" content="Sizi toyumuza dəvət edirik.">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#efe7dc">
    <link rel="icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Every family here was checked to carry ə/Ə, ş, ğ, ı, İ. Parisienne,
         Italianno, Cinzel and Marcellus look the part but have no ə. -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Pinyon+Script&family=Imperial+Script&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* =====================================================================
           One personal invitation. The card is drawn on a 1080 x 1920 grid;
           --u is one grid unit at the card's current size, so the page, the
           preview in the planner and the saved image all lay out alike.
           ===================================================================== */
        :root {
            --u: calc(100cqw / 1080);
            --page: #efe7dc;
            --ink: #4b3b2e;
            --chip-bg: rgba(255, 255, 255, .72);
            --chip-ink: #4b3b2e;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body {
            background: var(--page);
            color: var(--ink);
            font-family: 'Cormorant Garamond', Georgia, serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            transition: background .6s;
        }
        body.embed { background: transparent; }

        /* The card keeps 9:16 and is as big as the screen allows, leaving a
           strip underneath for the buttons (not in the planner's preview). */
        #card {
            position: relative;
            width: min(100vw, calc((100dvh - 76px) * 9 / 16));
            aspect-ratio: 9 / 16;
            container-type: inline-size;
            overflow: hidden;
            background: var(--page);
            user-select: none;
            -webkit-user-select: none;
        }
        body.embed #card { width: min(100vw, calc(100dvh * 9 / 16)); }
        @media (min-width: 700px) {
            body:not(.embed) #card { border-radius: 18px; box-shadow: 0 30px 80px rgba(60, 40, 20, .25); }
        }

        .layer { position: absolute; inset: 0; }
        .layer > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

        /* ------------------------------------------------------- the words */
        .content {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 20;
            pointer-events: none;
        }
        .ln { opacity: 0; white-space: pre-line; text-wrap: balance; }
        .ln.k-name, .ln.k-amp { white-space: nowrap; padding: 0 .35em; }
        .ln.k-date { display: flex; align-items: center; justify-content: center; }
        .k-date .dm, .k-date .dt { border-top: 1px solid currentColor; border-bottom: 1px solid currentColor; }
        .k-date .dd { display: flex; flex-direction: column; align-items: center; line-height: 1; }
        .k-date .dy { display: block; }
        .ln.k-pin svg { display: block; margin: 0 auto; }

        .gold {
            background: linear-gradient(100deg, #7d5d26 0%, #c9a45a 28%, #e9cf8f 45%, #a8823f 62%, #d9b86f 80%, #8b6a2f 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent !important;
        }

        /* Lines arrive one after another; each carries its own delay. */
        .play .ln { animation: lineIn .9s cubic-bezier(.2, .7, .2, 1) forwards; }
        .play .ln.wipe { opacity: 1; clip-path: inset(-20% 100% -20% 0); animation: wipeIn 1.7s cubic-bezier(.5, .1, .3, 1) forwards; }
        .play .ln.type { opacity: 1; animation: none; }
        .final .ln { opacity: 1; animation: none !important; clip-path: none !important; }
        @keyframes lineIn {
            from { opacity: 0; transform: translateY(calc(var(--u) * 26)); filter: blur(3px); }
            to   { opacity: 1; transform: none; filter: none; }
        }
        @keyframes wipeIn { to { clip-path: inset(-20% -10% -20% 0); } }
        .type .rest { color: transparent !important; -webkit-text-fill-color: transparent; }

        /* --------------------------------------------- floating sparkles */
        .sparkles { position: absolute; inset: 0; pointer-events: none; z-index: 15; overflow: hidden; }
        .sparkles i {
            position: absolute;
            width: calc(var(--u) * 7); height: calc(var(--u) * 7);
            border-radius: 50%;
            background: radial-gradient(circle, #fff 0%, rgba(255, 244, 214, .9) 35%, rgba(255, 236, 190, 0) 70%);
            opacity: 0;
            animation: drift linear infinite;
        }
        @keyframes drift {
            0%   { opacity: 0; transform: translate(0, 0) scale(.6); }
            15%  { opacity: .95; }
            85%  { opacity: .8; }
            100% { opacity: 0; transform: translate(calc(var(--u) * var(--dx)), calc(var(--u) * -260)) scale(1.1); }
        }

        /* ---------------------------------------------- tap-to-open intro */
        .hint {
            position: absolute;
            left: 0; right: 0;
            text-align: center;
            z-index: 60;
            pointer-events: none;
            transition: opacity .5s;
        }
        .hint .to {
            font-family: 'Great Vibes', cursive;
            font-size: calc(var(--u) * 78);
            line-height: 1.15;
            padding: 0 calc(var(--u) * 60);
            text-wrap: balance;
        }
        .hint .tap {
            margin-top: calc(var(--u) * 26);
            font-family: 'Montserrat', sans-serif;
            font-size: calc(var(--u) * 28);
            letter-spacing: .28em;
            text-transform: uppercase;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse { 50% { opacity: .35; } }
        .opened .hint { opacity: 0; }

        /* --- Qapı: two doors tied with satin bows swing open into the hall */
        .doors { position: absolute; inset: 0; z-index: 50; perspective: calc(var(--u) * 2600); cursor: pointer; }
        .door {
            position: absolute; top: 0; bottom: 0; width: 50%;
            background: linear-gradient(90deg, #ebe7e2, #f7f5f2 45%, #e9e5df);
            box-shadow: inset 0 0 calc(var(--u) * 40) rgba(120, 100, 80, .18);
            transition: transform 1.9s cubic-bezier(.6, .05, .25, 1);
            backface-visibility: hidden;
        }
        .door.l { left: 0; transform-origin: left center; }
        .door.r { right: 0; transform-origin: right center; }
        .door .panel {
            position: absolute;
            left: 13%; right: 13%;
            border: calc(var(--u) * 5) solid #f9f8f6;
            outline: calc(var(--u) * 3) solid rgba(140, 120, 100, .22);
            outline-offset: calc(var(--u) * -14);
            box-shadow: inset calc(var(--u) * 6) calc(var(--u) * 6) calc(var(--u) * 14) rgba(110, 90, 70, .16),
                        calc(var(--u) * 4) calc(var(--u) * 5) calc(var(--u) * 10) rgba(255, 255, 255, .8);
        }
        .door .p1 { top: 4%; height: 34%; }
        .door .p2 { top: 42%; height: 54%; }
        .door .ribbon {
            position: absolute; left: 0; right: 0; top: 41%; height: calc(var(--u) * 46);
            background: linear-gradient(180deg, #e4e0db, #fff 40%, #f1eeea 62%, #d6d1ca);
            box-shadow: 0 calc(var(--u) * 4) calc(var(--u) * 10) rgba(90, 70, 50, .18);
        }
        .doors .bow {
            position: absolute; left: 50%; top: 41%; width: calc(var(--u) * 560); height: calc(var(--u) * 710);
            margin: calc(var(--u) * -230) 0 0 calc(var(--u) * -280);
            z-index: 2;
            transition: transform .7s cubic-bezier(.5, -0.3, .6, 1), opacity .6s;
            filter: drop-shadow(0 calc(var(--u) * 14) calc(var(--u) * 18) rgba(80, 60, 40, .28));
        }
        .doors .bow svg { width: 100%; height: 100%; display: block; }
        .opened .doors .bow { transform: translateY(calc(var(--u) * 120)) scale(.3); opacity: 0; }
        .opened .door.l { transform: rotateY(-108deg); transition-delay: .45s; }
        .opened .door.r { transform: rotateY(108deg); transition-delay: .45s; }
        .done .doors { display: none; }

        /* --- Zərf: the seal breaks, the flap opens, the card rises out of it */
        .zgroup { position: absolute; inset: 0; perspective: calc(var(--u) * 3000); transform: translateY(calc(var(--u) * -470)); }
        .zgroup .layer { transform-origin: 50% 50%; }
        .z-back { z-index: 1; }
        .z-card { z-index: 2; transform-origin: 50% calc(925 / 1920 * 100%); transform: translate(0, calc(var(--u) * 555)) scale(.37); }
        .z-pocket { z-index: 3; }
        .z-flap { z-index: 5; transform-origin: 50% calc(1180 / 1920 * 100%); }
        .z-tap { position: absolute; inset: 0; z-index: 70; cursor: pointer; }
        .opened .zgroup { animation: zGroup 2.6s cubic-bezier(.55, 0, .25, 1) .55s forwards; }
        .opened .z-flap { animation: zFlap .9s ease-in-out forwards; }
        .opened .z-card { animation: zCard 2.6s cubic-bezier(.55, 0, .25, 1) .55s forwards; }
        .opened .z-seal { animation: zSeal .45s ease-in forwards; }
        .done .z-tap { display: none; }
        @keyframes zGroup { to { transform: none; } }
        @keyframes zFlap {
            0%   { transform: rotateX(0deg); z-index: 5; }
            49%  { z-index: 5; }
            50%  { z-index: 0; }
            100% { transform: rotateX(180deg); z-index: 0; }
        }
        @keyframes zCard {
            0%   { transform: translate(0, calc(var(--u) * 555)) scale(.37); z-index: 2; }
            42%  { transform: translate(0, calc(var(--u) * -170)) scale(.37); z-index: 2; }
            43%  { z-index: 6; }
            100% { transform: none; z-index: 6; }
        }
        @keyframes zSeal { to { transform: scale(1.4); opacity: 0; } }
        .final .zgroup, .done .zgroup { transform: none; animation: none; }
        .final .z-card, .done .z-card { transform: none; z-index: 6; animation: none; }
        .final .z-flap, .done .z-flap { display: none; }

        /* --- İpək: silk drifts, gold flourishes draw themselves */
        .silk-fold { animation: silk 14s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
        .silk-fold:nth-child(2n) { animation-duration: 18s; animation-delay: -6s; }
        .silk-fold:nth-child(3n) { animation-duration: 11s; animation-delay: -3s; }
        @keyframes silk {
            from { transform: translate(-2%, -1%) rotate(-1.5deg) scale(1.02); }
            to   { transform: translate(2%, 1.5%) rotate(1.5deg) scale(1.05); }
        }
        .play .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 3.2s ease-in-out .2s forwards; }
        @keyframes draw { to { stroke-dashoffset: 0; } }
        .final .silk-fold, .still .silk-fold { animation: none; }
        .still .sparkles { display: none; }

        @media (prefers-reduced-motion: reduce) {
            .silk-fold, .sparkles { animation: none !important; display: none; }
        }

        /* ------------------------------------------------- under the card */
        #bar {
            height: 76px;
            width: min(100vw, 560px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 12px;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity .6s, transform .6s;
            pointer-events: none;
            flex-wrap: wrap;
        }
        #bar.show { opacity: 1; transform: none; pointer-events: auto; }
        body.embed #bar { display: none; }
        #bar button, #bar a {
            appearance: none;
            border: 0;
            border-radius: 999px;
            background: var(--chip-bg);
            color: var(--chip-ink);
            font: 500 13px/1 'Montserrat', sans-serif;
            padding: 11px 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(60, 40, 20, .12);
            white-space: nowrap;
        }
        #bar button:active, #bar a:active { transform: scale(.96); }
        #bar svg { width: 15px; height: 15px; flex: none; }
        #countdown {
            position: absolute;
            top: calc(var(--u) * 36);
            left: 50%;
            transform: translateX(-50%);
            z-index: 40;
            font: 500 calc(var(--u) * 26)/1 'Montserrat', sans-serif;
            letter-spacing: .18em;
            text-transform: uppercase;
            padding: calc(var(--u) * 14) calc(var(--u) * 26);
            border-radius: 999px;
            background: var(--chip-bg);
            color: var(--chip-ink);
            opacity: 0;
            transition: opacity .8s;
            white-space: nowrap;
        }
        #countdown.show { opacity: 1; }
        body.embed #countdown { display: none; }

        .message-page {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: calc(var(--u) * 120);
            font-size: calc(var(--u) * 52); line-height: 1.35;
        }
        .message-page b { font-family: 'Great Vibes', cursive; font-weight: 400; font-size: calc(var(--u) * 110); display: block; margin-bottom: calc(var(--u) * 30); }
    </style>
</head>
<body>
    <div id="card" aria-live="polite"></div>
    <div id="bar"></div>

    <!--INVITE_DATA-->

    <script>
    'use strict';
    (function () {
        /* =================================================================
           DATA
           On the server the page arrives with its guest already inside
           (#invite-data). The planner shows it in an iframe and sends what
           to draw by postMessage; opened as a plain file it shows a sample.
           ================================================================= */
        const W = 1080, H = 1920;
        const params = new URLSearchParams(location.search);
        const isPreview = location.hash.indexOf('preview') !== -1;
        const MONTHS = ['Yanvar', 'Fevral', 'Mart', 'Aprel', 'May', 'İyun', 'İyul', 'Avqust', 'Sentyabr', 'Oktyabr', 'Noyabr', 'Dekabr'];
        const WEEKDAYS = ['Bazar', 'Bazar ertəsi', 'Çərşənbə axşamı', 'Çərşənbə', 'Cümə axşamı', 'Cümə', 'Şənbə'];

        const SAMPLE = {
            invitation: {
                name1: 'Tural', name2: 'Camalə',
                date: '2026-10-16', time: '18:00',
                venue: 'Bağçalı Saray', address: '',
                message: 'Böyük məmnuniyyətlə Sizi ailəmizin şad gününün sevincini bizimlə bölüşmək üçün toy mərasiminə dəvət edirik!',
                host: '', template: params.get('t') || 'qapi', showSeats: true, showTable: false
            },
            guest: { name: 'Əli Məmmədov', title: 'bəy', amount: 4 },
            table: 'Masa 7'
        };

        function readEmbedded() {
            const el = document.getElementById('invite-data');
            if (!el) return undefined;
            try { return JSON.parse(el.textContent); } catch { return null; }
        }

        /* ------------------------------------------------------- helpers */
        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
        }
        // The upper/lower case of i in Azerbaijani: i ↔ İ, ı ↔ I.
        function upperAz(s) { return String(s).replace(/i/g, 'İ').replace(/ı/g, 'I').toUpperCase(); }
        function parseDate(inv) {
            const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(inv.date || '');
            if (!m) return null;
            const t = /^(\d{1,2}):(\d{2})$/.exec(inv.time || '') || [0, '0', '00'];
            return new Date(+m[1], +m[2] - 1, +m[3], +t[1], +t[2]);
        }
        // Seeded so the page and the saved image draw the same flowers.
        function rng(seed) {
            let s = seed >>> 0;
            return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
        }
        // "Hörmətli Əli bəy və ailəsi": the title (bəy / xanım) the planner
        // chose, and "və ailəsi" when the invitation is for more than one.
        function greetingOf(guest) {
            const g = guest || {};
            let n = String(g.name || '').trim();
            if (!n) return 'Hörmətli qonağımız';
            n = n.replace(/^hörmətli\s+/i, '');
            const title = g.title === 'bəy' || g.title === 'xanım' ? g.title : '';
            if (title && !n.toLocaleLowerCase('az').endsWith(' ' + title)) n += ' ' + title;
            if ((Number(g.amount) || 0) > 1 && !/ailəsi$/i.test(n)) n += ' və ailəsi';
            return 'Hörmətli ' + n;
        }

        /* =================================================================
           ART
           Every picture is an SVG on the 1080 x 1920 grid. The page shows
           it inline (and animates bits of it); the saved image draws the
           very same markup onto a canvas.
           ================================================================= */
        function svg(body, defs) {
            return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice"><defs>${defs || ''}</defs>${body}</svg>`;
        }

        // A soft garden rose / peony: outer petals, an inner ring, a curled heart.
        function rose(x, y, r, rot, id) {
            let s = `<g transform="translate(${x} ${y}) rotate(${rot})">`;
            s += `<circle r="${r * 1.02}" fill="url(#${id}b)"/>`;
            for (let i = 0; i < 8; i++) {
                s += `<ellipse cx="0" cy="${-r * .52}" rx="${r * .52}" ry="${r * .5}" transform="rotate(${i * 45 + 10})" fill="url(#${id}p)" stroke="url(#${id}e)" stroke-width="${r * .025}"/>`;
            }
            for (let i = 0; i < 6; i++) {
                s += `<ellipse cx="0" cy="${-r * .3}" rx="${r * .36}" ry="${r * .32}" transform="rotate(${i * 60 + 30})" fill="url(#${id}p)" stroke="url(#${id}e)" stroke-width="${r * .02}"/>`;
            }
            s += `<circle r="${r * .3}" fill="url(#${id}c)"/>`;
            for (let k = 0; k < 4; k++) {
                const rr = r * (.26 - k * .055);
                s += `<path d="M ${-rr} 0 A ${rr} ${rr} 0 1 1 ${rr * .55} ${rr * .8}" fill="none" stroke="url(#${id}e)" stroke-width="${r * .03}" stroke-linecap="round" transform="rotate(${k * 70})"/>`;
            }
            return s + '</g>';
        }
        function roseDefs(id, light, mid, dark) {
            return `<radialGradient id="${id}b"><stop offset="0" stop-color="${mid}"/><stop offset="1" stop-color="${dark}" stop-opacity=".55"/></radialGradient>
                <radialGradient id="${id}p" cx=".5" cy=".85" r=".9"><stop offset="0" stop-color="${mid}"/><stop offset=".55" stop-color="${light}"/><stop offset="1" stop-color="#fff"/></radialGradient>
                <radialGradient id="${id}c"><stop offset="0" stop-color="${dark}"/><stop offset="1" stop-color="${mid}"/></radialGradient>
                <linearGradient id="${id}e"><stop offset="0" stop-color="${dark}" stop-opacity=".55"/><stop offset="1" stop-color="${dark}" stop-opacity=".2"/></linearGradient>`;
        }
        function leaf(x, y, len, wid, rot, fill) {
            return `<g transform="translate(${x} ${y}) rotate(${rot})"><path d="M0 0 Q ${wid} ${-len * .45} 0 ${-len} Q ${-wid} ${-len * .45} 0 0 Z" fill="${fill}"/><path d="M0 0 L0 ${-len * .92}" stroke="#fff" stroke-opacity=".35" stroke-width="2"/></g>`;
        }
        // Roses, leaves and baby's breath around one corner.
        function bouquet(cx, cy, scale, seed, flip, id) {
            const R = rng(seed);
            let s = `<g transform="translate(${cx} ${cy}) scale(${flip ? -scale : scale} ${scale})" filter="url(#soft)">`;
            for (let i = 0; i < 9; i++) {
                const a = R() * Math.PI * 1.1 - .2, d = 90 + R() * 150;
                s += leaf(Math.cos(a) * d * .7, Math.sin(a) * d * .7, 120 + R() * 70, 34 + R() * 16, a * 57 + 90, R() > .5 ? '#a9b59a' : '#c3cbb4');
            }
            for (let i = 0; i < 14; i++) {
                const a = R() * Math.PI * 2, d = 110 + R() * 120;
                const x = Math.cos(a) * d, y = Math.sin(a) * d;
                s += `<path d="M0 0 Q ${x * .5} ${y * .4} ${x} ${y}" stroke="#b9c0aa" stroke-width="2" fill="none"/>`;
                s += `<circle cx="${x}" cy="${y}" r="${5 + R() * 5}" fill="#fffdf8"/><circle cx="${x + 9}" cy="${y - 6}" r="${4 + R() * 3}" fill="#fbf4e8"/>`;
            }
            s += rose(-40, 30, 92, R() * 90, id);
            s += rose(90, -40, 70, R() * 90, id);
            s += rose(40, 120, 58, R() * 90, id);
            return s + '</g>';
        }

        /* ---------------------------------------------------- Qapı (hall) */
        function artQapi() {
            const defs = roseDefs('rq', '#fbf3e6', '#efdcc0', '#c9a77c') + `
                <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efe7dc"/><stop offset="1" stop-color="#f7f2ea"/></linearGradient>
                <linearGradient id="inner" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf8f3"/><stop offset=".6" stop-color="#f3ece2"/><stop offset="1" stop-color="#ece3d6"/></linearGradient>
                <linearGradient id="pil" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e6ddd0"/><stop offset=".45" stop-color="#faf7f2"/><stop offset="1" stop-color="#ddd3c4"/></linearGradient>
                <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efe8de"/><stop offset="1" stop-color="#fbf8f4"/></linearGradient>
                <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
                <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.1"/></filter>
                <filter id="blur30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>`;
            const arch = (inset) => {
                const l = 150 + inset, r = 930 - inset, top = 250 + inset, rad = (r - l) / 2;
                return `M ${l} 1700 L ${l} ${top + rad} A ${rad} ${rad} 0 0 1 ${r} ${top + rad} L ${r} 1700 Z`;
            };
            let b = `<rect width="${W}" height="${H}" fill="url(#wall)"/>`;

        /* ------------------------------------------------- Zərf (envelope) */
        function lily(x, y, s, rot) {

                <path d="M0 0 C -6 120 -14 260 -30 420" stroke="#6f8a52" stroke-width="12" fill="none" stroke-linecap="round"/>

                <path d="M0 0 C -30 -50 -40 -120 -20 -190 C 0 -240 50 -280 92 -300 C 40 -250 10 -170 14 -90 C 16 -50 10 -20 0 0 Z" fill="#ffffff" opacity=".85"/>

                <path d="M0 0 C 14 -6 22 -20 26 -38" stroke="#7d9b5c" stroke-width="10" fill="none" stroke-linecap="round"/>

        function lace(x, y, w, h) {
            // Scalloped edge, a band of pierced holes, then the plain paper.
            let s = '';
            const step = 34, r = 21;
            for (let i = x; i <= x + w; i += step) { s += `<circle cx="${i}" cy="${y}" r="${r}"/><circle cx="${i}" cy="${y + h}" r="${r}"/>`; }
            for (let j = y; j <= y + h; j += step) { s += `<circle cx="${x}" cy="${j}" r="${r}"/><circle cx="${x + w}" cy="${j}" r="${r}"/>`; }
            let holes = '';
            const band = (px, py, horizontal, len) => {
                for (let t = 0; t <= len; t += 17) {
                    const a = horizontal ? px + t : px, b = horizontal ? py : py + t;
                    holes += `<circle cx="${a}" cy="${b}" r="5"/>`;
                }
            };
            band(x + 10, y + 16, true, w - 20); band(x + 10, y + h - 16, true, w - 20);
            band(x + 16, y + 10, false, h - 20); band(x + w - 16, y + 10, false, h - 20);
            let flowers = '';
            for (let i = x + 50; i < x + w - 30; i += 68) {
                flowers += `<g transform="translate(${i} ${y + 44})">${[0, 72, 144, 216, 288].map(a => `<ellipse cy="-9" rx="5" ry="9" transform="rotate(${a})"/>`).join('')}</g>`;
                flowers += `<g transform="translate(${i} ${y + h - 44})">${[0, 72, 144, 216, 288].map(a => `<ellipse cy="-9" rx="5" ry="9" transform="rotate(${a})"/>`).join('')}</g>`;
            }
            for (let j = y + 110; j < y + h - 60; j += 68) {
                flowers += `<g transform="translate(${x + 44} ${j})">${[0, 72, 144, 216, 288].map(a => `<ellipse cy="-9" rx="5" ry="9" transform="rotate(${a})"/>`).join('')}</g>`;
                flowers += `<g transform="translate(${x + w - 44} ${j})">${[0, 72, 144, 216, 288].map(a => `<ellipse cy="-9" rx="5" ry="9" transform="rotate(${a})"/>`).join('')}</g>`;
            }
            return `<g filter="url(#cardShadow)"><g fill="#fdfcfa">${s}<rect x="${x}" y="${y}" width="${w}" height="${h}"/></g></g>
                <g fill="#d9d4cc" opacity=".75">${holes}</g>
                <g fill="none" stroke="#d6d0c6" stroke-width="2.5">${flowers}</g>
                <rect x="${x + 70}" y="${y + 80}" width="${w - 140}" height="${h - 160}" fill="#fffefc" stroke="#e1dbd2" stroke-width="2"/>
                <rect x="${x + 84}" y="${y + 94}" width="${w - 168}" height="${h - 188}" fill="none" stroke="#ece7e0" stroke-width="1.5"/>`;
        }

        // What the card says, in order. Empty fields simply drop out.
        function linesOf(d) {
            const inv = d.invitation || {};
            const out = [];
            out.push({ k: 'greet', text: greetingOf(d.guest) });
            if (inv.name1) out.push({ k: 'name', text: inv.name1 });
            if (inv.name1 && inv.name2) out.push({ k: 'amp', text: '&' });
            if (inv.name2) out.push({ k: 'name', text: inv.name2 });
            if (inv.message) out.push({ k: 'msg', text: inv.message });
            const when = parseDate(inv);
            if (when) {
                out.push({
                    k: 'date',
                    month: upperAz(MONTHS[when.getMonth()]),
                    day: String(when.getDate()),
                    year: String(when.getFullYear()),
                    time: inv.time || '',
                    weekday: WEEKDAYS[when.getDay()]
                });
            }
            if (inv.venue) { out.push({ k: 'pin' }); out.push({ k: 'venue', text: inv.venue }); }
            if (inv.address) out.push({ k: 'addr', text: inv.address });
            const seat = [];
            const n = Number(d.guest && d.guest.amount) || 0;
            if (inv.showSeats !== false && n > 0) seat.push(`Dəvətnamə ${n} nəfər üçündür`);
            if (inv.showTable && d.table) seat.push(d.table);
            if (seat.length) out.push({ k: 'seat', text: seat.join('\n') });
            if (inv.host) out.push({ k: 'host', text: /^hörmətlə/i.test(inv.host) ? inv.host : 'Hörmətlə, ' + inv.host });
            return out;
        }

        // How an invitation opens. With animation off it is simply the card.
        function modeOf(inv) {
            inv = inv || {};
            if (inv.animate === false) return 'final';
            return inv.template === 'qapi' || inv.template === 'zerf' || !THEMES[inv.template] ? 'intro' : 'play';
        }

        const PIN_PATH = 'M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z';

        /* =================================================================
           PAGE RENDER
           ================================================================= */
        const card = document.getElementById('card');
        const bar = document.getElementById('bar');
        let current = null;      // the data being shown
        let timers = [];

        function px(n) { return `calc(var(--u) * ${n} * var(--k, 1))`; }
        function styleOf(st) {
            let s = '';
            if (st.f) s += `font-family:'${st.f}';`;
            if (st.s) s += `font-size:${px(st.s)};`;
            if (st.w) s += `font-weight:${st.w};`;
            if (st.st) s += `font-style:${st.st};`;
            if (st.lh) s += `line-height:${st.lh};`;
            if (st.ls) s += `letter-spacing:${st.ls}em;`;
            if (st.caps) s += 'text-transform:uppercase;';
            if (st.c) s += `color:${st.c};`;
            if (st.mt) s += `margin-top:${px(st.mt)};`;
            if (st.mb) s += `margin-bottom:${px(st.mb)};`;
            return s;
        }
        function lineHtml(line, theme) {
            const st = theme.k[line.k] || {};
            const cls = ['ln', 'k-' + line.k];
            if (st.gold) cls.push('gold');
            if (st.wipe) cls.push('wipe');
            if (st.type) cls.push('type');
            if (line.k === 'date') {
                const side = `padding:${px(10)} ${px(26)};font-size:${px(st.s)};letter-spacing:.14em;${st.lines ? '' : 'border-color:transparent;'}`;
                return `<div class="${cls.join(' ')}" style="${styleOf(Object.assign({}, st, { s: 0 }))}">
                    <span class="dm" style="${side}">${esc(line.month)}</span>
                    <span class="dd" style="margin:0 ${px(30)};">
                        <span style="font-size:${px(st.day)};font-weight:${st.light ? 300 : 500};">${esc(line.day)}</span>
                        <span class="dy" style="font-size:${px(st.s * .85)};letter-spacing:.2em;margin-top:${px(8)};">${esc(line.year)}</span>
                    </span>
                    <span class="dt" style="${side}">${esc(line.time || line.weekday)}</span>
                </div>`;
            }
            if (line.k === 'pin') {
                return `<div class="${cls.join(' ')}" style="margin-top:${px(st.mt)};color:${st.c};">
                    <svg viewBox="0 0 24 24" style="width:${px(st.s)};height:${px(st.s)};"><path d="${PIN_PATH}" fill="currentColor"/></svg></div>`;
            }
            const text = esc(line.text);
            return `<div class="${cls.join(' ')}" style="${styleOf(st)}">${st.type ? `<span class="shown"></span><span class="rest">${text}</span>` : text}</div>`;
        }

        function contentHtml(d, theme) {
            const b = theme.box;
            return `<div class="content" style="left:calc(var(--u) * ${b.x});top:calc(var(--u) * ${b.y});width:calc(var(--u) * ${b.w});height:calc(var(--u) * ${b.h});color:${theme.ink};">
                <div class="inner" style="display:flex;flex-direction:column;align-items:center;width:100%;">${linesOf(d).map(l => lineHtml(l, theme)).join('')}</div></div>`;
        }

        function sparklesHtml(n) {
            const R = rng(5);
            let s = '<div class="sparkles">';
            for (let i = 0; i < n; i++) {
                s += `<i style="left:${(R() * 100).toFixed(1)}%;top:${(30 + R() * 70).toFixed(1)}%;--dx:${(R() * 120 - 60).toFixed(0)};animation-duration:${(5 + R() * 6).toFixed(1)}s;animation-delay:${(-R() * 10).toFixed(1)}s;"></i>`;
            }
            return s + '</div>';
        }

        function layer(markup, cls) { return `<div class="layer ${cls || ''}">${markup}</div>`; }

        // Shrink every size together when a long message would overflow the box.
        function fit() {
            const content = card.querySelector('.content');
            if (!content) return;
            const inner = content.firstElementChild;
            card.style.setProperty('--k', 1);
            const need = inner.scrollHeight, have = content.clientHeight;
            if (need > have && need > 0) card.style.setProperty('--k', (have / need * .98).toFixed(3));
        }

        function clearTimers() { timers.forEach(clearTimeout); timers = []; }
        function later(ms, fn) { timers.push(setTimeout(fn, ms)); }

        // Delays for each line; returns when the last one has landed.
        function schedule(theme, startAt) {
            let t = startAt;
            const lines = Array.from(card.querySelectorAll('.ln'));
            lines.forEach(el => {
                const kind = (el.className.match(/k-(\w+)/) || [])[1];
                const st = theme.k[kind] || {};
                el.style.animationDelay = t + 'ms';
                if (st.type) {
                    const full = el.querySelector('.rest').textContent;
                    const shown = el.querySelector('.shown');
                    const rest = el.querySelector('.rest');
                    const per = Math.max(14, Math.min(38, 2600 / full.length));
                    for (let i = 1; i <= full.length; i++) {
                        later(t + i * per, () => { shown.textContent = full.slice(0, i); rest.textContent = full.slice(i); });
                    }
                    t += full.length * per + 150;
                } else if (st.wipe) {
                    t += 1250;
                } else if (kind === 'name' || kind === 'amp') {
                    t += 520;
                } else if (kind === 'pin') {
                    t += 150;
                } else {
                    t += 380;
                }
            });
            return t + 500;
        }

        function finishTyping() {
            card.querySelectorAll('.ln.type').forEach(el => {
                const shown = el.querySelector('.shown'), rest = el.querySelector('.rest');
                if (shown && rest) { shown.textContent += rest.textContent; rest.textContent = ''; }
            });
        }

        /* show(d, mode): mode 'intro' waits for a tap (doors / envelope);
           'play' runs the animation straight away; 'final' draws the end. */
        function show(d, mode, auto) {
            clearTimers();
            current = d;
            const inv = d.invitation || {};
            const key = THEMES[inv.template] ? inv.template : 'qapi';
            const theme = THEMES[key];
            document.documentElement.style.setProperty('--page', theme.page);
            document.documentElement.style.setProperty('--chip-bg', theme.chipBg);
            document.documentElement.style.setProperty('--chip-ink', theme.chipInk);
            document.querySelector('meta[name="theme-color"]').setAttribute('content', theme.page);
            if (matchMedia('(prefers-reduced-motion: reduce)').matches && mode !== 'final') mode = 'final';

            const greet = esc(greetingOf(d.guest));
            let html = '';
            if (key === 'qapi') {
                const [hall] = art('qapi');
                html = layer(hall) + sparklesHtml(26) + contentHtml(d, theme);
                if (mode === 'intro') {
                    const door = side => `<div class="door ${side}"><div class="panel p1"></div><div class="panel p2"></div><div class="ribbon"></div></div>`;
                    html += `<div class="doors" role="button" aria-label="Dəvətnaməni aç">${door('l')}${door('r')}<div class="bow">${bowSvg()}</div></div>
                        <div class="hint" style="bottom:calc(var(--u) * 150);color:#6b5a48;"><div class="to">${greet}</div><div class="tap">Açmaq üçün toxunun</div></div>`;
                }
            } else if (key === 'zerf') {
                const a = art('zerf');
                html = layer(a.bg) +
                    `<div class="zgroup">${layer(a.back, 'z-back')}${layer(a.flap + `<div class="layer z-seal">${a.seal}</div>`, 'z-flap')}
                        <div class="layer z-card">${a.card}${contentHtml(d, theme)}</div>${layer(a.pocket, 'z-pocket')}</div>`;
                if (mode === 'intro') {
                    html += `<div class="z-tap" role="button" aria-label="Dəvətnaməni aç"></div>
                        <div class="hint" style="top:calc(var(--u) * 330);color:#4a4540;"><div class="to" style="font-family:'Pinyon Script';">${greet}</div><div class="tap">Möhürə toxunun</div></div>`;
                }
            } else if (key === 'klassik') {
                html = layer(art('klassik')[0]) + contentHtml(d, theme);
            } else {
                const [silk, gold] = art('ipek');
                html = layer(silk) + layer(gold) + sparklesHtml(14) + contentHtml(d, theme);
            }

            card.className = key + ' ' + (mode === 'final' ? 'final done' : '') + (inv.animate === false ? ' still' : '');
            card.innerHTML = html;
            fit();
            hideBar();

            if (mode === 'final') { finishTyping(); revealExtras(0); return; }

            const start = (delay) => {
                card.classList.add('play');
                const end = schedule(theme, delay);
                later(end, () => { card.classList.add('done'); revealExtras(0); });
            };
            if (mode === 'intro') {
                const opener = card.querySelector('.doors, .z-tap');
                const open = () => {
                    opener.removeEventListener('click', open);
                    card.classList.add('opened');
                    if (key === 'qapi') later(2300, () => card.classList.add('done'));
                    start(key === 'qapi' ? 1500 : 3000);
                };
                opener.addEventListener('click', open);
                if (auto || params.has('auto')) later(1400, open);
            } else {
                start(key === 'ipek' ? 500 : 300);
            }
        }

        const artCache = {};
        function art(key) {
            if (!artCache[key]) artCache[key] = ({ qapi: artQapi, zerf: artZerf, ipek: artIpek, klassik: artKlassik })[key]();
            return artCache[key];
        }

        window.addEventListener('resize', fit);

        /* =================================================================
           THE BAR: map, calendar, save as picture, play again
           ================================================================= */
        const ICONS = {
            map: '<svg viewBox="0 0 24 24"><path d="' + PIN_PATH + '" fill="currentColor"/></svg>',
            cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
            img: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16"/></svg>',
            again: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/></svg>'
        };
        function mapUrl(inv) {
            if (inv.mapUrl && /^https?:\/\//i.test(inv.mapUrl)) return inv.mapUrl;
            const q = [inv.venue, inv.address].filter(Boolean).join(', ');
            return q ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q) : '';
        }
        function hideBar() {
            bar.classList.remove('show');
            const cd = document.getElementById('countdown');
            if (cd) cd.remove();
        }
        function revealExtras(delay) {
            if (document.body.classList.contains('embed')) return;
            const inv = current.invitation || {};
            const url = mapUrl(inv);
            const when = parseDate(inv);
            bar.innerHTML =
                (url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${ICONS.map} Xəritə</a>` : '') +
                (when ? `<button type="button" data-act="cal">${ICONS.cal} Təqvimə əlavə et</button>` : '') +
                `<button type="button" data-act="img">${ICONS.img} Şəkil kimi saxla</button>` +
                (modeOf(inv) !== 'final' ? `<button type="button" data-act="again" aria-label="Yenidən oynat">${ICONS.again}</button>` : '');
            later(delay, () => bar.classList.add('show'));

            if (when) {
                const today = new Date(); today.setHours(0, 0, 0, 0);
                const day = new Date(when); day.setHours(0, 0, 0, 0);
                const days = Math.round((day - today) / 86400000);
                const text = days > 1 ? `Toya ${days} gün qaldı` : days === 1 ? 'Toy sabahdır' : days === 0 ? 'Toy bu gündür' : '';
                if (text) {
                    const cd = document.createElement('div');
                    cd.id = 'countdown';
                    cd.textContent = text;
                    card.appendChild(cd);
                    later(delay + 400, () => cd.classList.add('show'));
                }
            }
        }
        bar.addEventListener('click', e => {
            const btn = e.target.closest('button');
            if (!btn || !current) return;
            if (btn.dataset.act === 'again') show(current, modeOf(current.invitation));
            if (btn.dataset.act === 'cal') downloadIcs(current);
            if (btn.dataset.act === 'img') saveImage(btn);
        });

        function downloadIcs(d) {
            const inv = d.invitation || {};
            const when = parseDate(inv);
            if (!when) return;
            const end = new Date(when.getTime() + 5 * 3600 * 1000);
            const f = t => `${t.getFullYear()}${String(t.getMonth() + 1).padStart(2, '0')}${String(t.getDate()).padStart(2, '0')}T${String(t.getHours()).padStart(2, '0')}${String(t.getMinutes()).padStart(2, '0')}00`;
            const icsEsc = s => String(s || '').replace(/([,;\\])/g, '\\$1').replace(/\n/g, '\\n');
            const title = [inv.name1, inv.name2].filter(Boolean).join(' & ') + ' — toy';
            const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//TablePlanner//Devetname//AZ', 'BEGIN:VEVENT',
                'UID:' + Date.now() + '@devetname', 'DTSTAMP:' + f(new Date()), 'DTSTART:' + f(when), 'DTEND:' + f(end),
                'SUMMARY:' + icsEsc(title), 'LOCATION:' + icsEsc([inv.venue, inv.address].filter(Boolean).join(', ')),
                'DESCRIPTION:' + icsEsc(inv.message), 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
            a.download = 'toy.ics';
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        }

        /* =================================================================
           THE SAVED PICTURE
           The same SVG art and the same line table, drawn on a canvas at
           full 1080 x 1920. Used by the button above and by the planner.
           ================================================================= */
        function loadSvg(markup) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error('svg'));
                img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(markup);
            });
        }
        function fontOf(st, size) {
            return `${st.st || 'normal'} ${st.w || 400} ${size}px "${st.f}"`;
        }
        function goldFill(ctx, x0, x1) {
            const g = ctx.createLinearGradient(x0, 0, x1, 0);
            [['0', '#7d5d26'], ['.28', '#c9a45a'], ['.45', '#e9cf8f'], ['.62', '#a8823f'], ['.8', '#d9b86f'], ['1', '#8b6a2f']]
                .forEach(([o, c]) => g.addColorStop(+o, c));
            return g;
        }
        function setSpacing(ctx, em, size) { if ('letterSpacing' in ctx) ctx.letterSpacing = (em ? em * size : 0) + 'px'; }

        function wrap(ctx, text, maxW) {
            const out = [];
            String(text).split('\n').forEach(par => {
                const words = par.split(/\s+/).filter(Boolean);
                let line = '';
                words.forEach(w => {
                    const test = line ? line + ' ' + w : w;
                    if (ctx.measureText(test).width > maxW && line) { out.push(line); line = w; } else line = test;
                });
                out.push(line);
            });
            return out;
        }

        async function renderImage(d, type) {
            const inv = d.invitation || {};
            const key = THEMES[inv.template] ? inv.template : 'qapi';
            const theme = THEMES[key];
            const lines = linesOf(d);
            await document.fonts.ready;
            const fams = new Set();
            Object.values(theme.k).forEach(st => st.f && fams.add(fontOf(st, 40)));
            const sample = lines.map(l => l.text || (l.month + l.day + l.year + l.time)).join(' ');
            await Promise.all(Array.from(fams).map(f => document.fonts.load(f, sample).catch(() => null)));

            const cv = document.createElement('canvas');
            cv.width = W; cv.height = H;
            const ctx = cv.getContext('2d');
            ctx.fillStyle = theme.page; ctx.fillRect(0, 0, W, H);

            const a = art(key);
            const layers = key === 'zerf' ? [a.bg, a.back, a.pocket, a.card] : a;
            for (const m of layers) ctx.drawImage(await loadSvg(m.replace('preserveAspectRatio="xMidYMid slice"', '')), 0, 0, W, H);

            // Measure first, then scale everything down together if needed.
            const box = theme.box;
            const measure = k => lines.map(l => {
                const st = theme.k[l.k] || {};
                const size = (st.s || 40) * k;
                if (l.k === 'pin') return { l, st, size, h: size + (st.mt || 0) * k };
                if (l.k === 'date') return { l, st, size, h: ((st.day || 100) * 1.0 + st.s * .85 + 8) * k + (st.mt || 0) * k };
                ctx.font = fontOf(st, size); setSpacing(ctx, st.ls, size);
                const text = st.caps ? upperAz(l.text) : l.text;
                const rows = (l.k === 'name' || l.k === 'amp') ? [text] : wrap(ctx, text, box.w);
                return { l, st, size, rows, h: rows.length * size * (st.lh || 1.2) + ((st.mt || 0) + (st.mb || 0)) * k };
            });
            let k = 1, m = measure(1), total = m.reduce((n, r) => n + r.h, 0);
            if (total > box.h) { k = box.h / total * .98; m = measure(k); total = m.reduce((n, r) => n + r.h, 0); }

            let y = box.y + (box.h - total) / 2;
            const cx = box.x + box.w / 2;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            for (const r of m) {
                const st = r.st;
                y += (st.mt || 0) * k;
                if (r.l.k === 'pin') {
                    ctx.save();
                    ctx.translate(cx - r.size / 2, y); ctx.scale(r.size / 24, r.size / 24);
                    ctx.fillStyle = st.c; ctx.fill(new Path2D(PIN_PATH));
                    ctx.restore();
                    y += r.size;
                    continue;
                }
                if (r.l.k === 'date') {
                    const dayS = (st.day || 100) * k, side = st.s * k;
                    ctx.fillStyle = st.c || theme.ink;
                    ctx.font = fontOf(Object.assign({}, st, { w: st.light ? 300 : 500 }), dayS); setSpacing(ctx, 0, dayS);
                    const dayW = ctx.measureText(r.l.day).width;
                    const midY = y + dayS * .5;
                    ctx.fillText(r.l.day, cx, midY);
                    ctx.font = fontOf(st, side * .85); setSpacing(ctx, .2, side * .85);
                    ctx.fillText(r.l.year, cx, y + dayS + side * .45 + 8 * k);
                    ctx.font = fontOf(st, side); setSpacing(ctx, .14, side);
                    const gap = 30 * k + 26 * k;
                    const left = r.l.month, right = r.l.time || r.l.weekday;
                    const lw = ctx.measureText(left).width, rw = ctx.measureText(right).width;
                    ctx.textAlign = 'right'; ctx.fillText(left, cx - dayW / 2 - gap, midY);
                    ctx.textAlign = 'left'; ctx.fillText(right, cx + dayW / 2 + gap, midY);
                    ctx.textAlign = 'center';
                    if (st.lines) {
                        ctx.strokeStyle = st.c; ctx.lineWidth = 1.5;
                        const pad = 26 * k, hh = side * .9;
                        [[cx - dayW / 2 - gap + pad - lw - pad * 2, lw + pad * 2], [cx + dayW / 2 + gap - pad, rw + pad * 2]].forEach(([x0, w]) => {
                            ctx.beginPath(); ctx.moveTo(x0, midY - hh); ctx.lineTo(x0 + w, midY - hh);
                            ctx.moveTo(x0, midY + hh); ctx.lineTo(x0 + w, midY + hh); ctx.stroke();
                        });
                    }
                    y += r.h - (st.mt || 0) * k;
                    continue;
                }
                ctx.font = fontOf(st, r.size); setSpacing(ctx, st.ls, r.size);
                const lh = r.size * (st.lh || 1.2);
                r.rows.forEach(row => {
                    if (st.gold) {
                        const w = ctx.measureText(row).width;
                        ctx.fillStyle = goldFill(ctx, cx - w / 2, cx + w / 2);
                    } else ctx.fillStyle = st.c || theme.ink;
                    ctx.fillText(row, cx, y + lh / 2);
                    y += lh;
                });
                y += (st.mb || 0) * k;
            }
            setSpacing(ctx, 0, 0);
            return new Promise(resolve => cv.toBlob(resolve, type || 'image/jpeg', .92));
        }

        function fileNameOf(d) {
            const n = String((d.guest && d.guest.name) || 'qonaq').toLowerCase()
                .replace(/ə/g, 'e').replace(/ı/g, 'i').replace(/ş/g, 's').replace(/ç/g, 'c').replace(/ğ/g, 'g').replace(/ö/g, 'o').replace(/ü/g, 'u')
                .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
            return `devetname-${n || 'qonaq'}.jpg`;
        }

        async function saveImage(btn) {
            const label = btn.innerHTML;
            btn.disabled = true; btn.textContent = 'Hazırlanır…';
            try {
                const blob = await renderImage(current);
                const file = new File([blob], fileNameOf(current), { type: 'image/jpeg' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
                }
                const a = document.createElement('a');
                a.href = URL.createObjectURL(file); a.download = file.name;
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(a.href), 4000);
            } finally {
                btn.disabled = false; btn.innerHTML = label;
            }
        }

        /* =================================================================
           START
           ================================================================= */
        function messagePage(title, text) {
            card.className = 'final';
            card.innerHTML = layer(art('qapi')[0]) + `<div class="message-page"><b>${esc(title)}</b>${esc(text)}</div>`;
        }

        if (isPreview && window.parent !== window) {
            // The planner drives this frame: what to show, and pictures to make.
            document.body.classList.add('embed');
            const reply = (msg) => window.parent.postMessage(msg, location.origin === 'null' ? '*' : location.origin);
            window.addEventListener('message', async (e) => {
                if (e.source !== window.parent) return;
                if (location.origin !== 'null' && e.origin !== location.origin) return;
                const msg = e.data || {};
                if (msg.type === 'invite-show') show(msg.data, msg.mode || 'final', msg.auto);
                if (msg.type === 'invite-render') {
                    try { reply({ type: 'invite-image', id: msg.id, blob: await renderImage(msg.data), name: fileNameOf(msg.data) }); }
                    catch (err) { reply({ type: 'invite-image', id: msg.id, error: String(err && err.message || err) }); }
                }
            });
            reply({ type: 'invite-ready' });
        } else {
            const embedded = readEmbedded();
            if (embedded === undefined) {
                if (params.has('still')) SAMPLE.invitation.animate = false;
                show(SAMPLE, modeOf(SAMPLE.invitation));
            } else if (!embedded || !embedded.guest) {
                messagePage('Bağışlayın', 'Bu dəvətnamə tapılmadı. Linki sizə göndərən şəxslə əlaqə saxlayın.');
            } else {
                show(embedded, modeOf(embedded.invitation));
            }
        }
    })();
    </script>
</body>
</html>
