# TablePlanner on the k3s box.
#
#   kubectl apply --dry-run=server -f deploy/      # always first
#   kubectl apply -f deploy/
#
# Namespace is lab/ to start. Promote to apps/ once it has proven itself.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tableplanner
  namespace: lab
  labels:
    app: tableplanner
spec:
  replicas: 1
  strategy:
    type: Recreate          # single writer, single row: never two versions at once
  selector:
    matchLabels:
      app: tableplanner
  template:
    metadata:
      labels:
        app: tableplanner
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      # Compose runs migrations in its command; the image's own CMD does not.
      # Without this the pod starts against an empty database and reports Ready
      # while every read fails. Migrations are idempotent, so re-running is safe.
      initContainers:
        - name: migrate
          image: ghcr.io/therehim/tableplanner@sha256:ffb9387d4d591259f1cc1d33b73406ba48decd2afb52700be76158c1660b9e07
          command: ["node", "scripts/migrate.mjs"]
          envFrom:
            - secretRef:
                name: tableplanner-secrets
          resources:
            requests: { memory: 64Mi, cpu: 50m }
            limits:   { memory: 128Mi, cpu: 500m }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: app
          # NEVER :latest - box rule.
          #
          # This pin WILL be out of date: the image labels embed the commit
          # SHA, so every push to main publishes a new digest and any value
          # committed here is stale immediately. Resolve the real one before
          # deploying:
          #     sh server/scripts/current-digest.sh
          image: ghcr.io/therehim/tableplanner@sha256:ffb9387d4d591259f1cc1d33b73406ba48decd2afb52700be76158c1660b9e07
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: COOKIE_SECURE
              value: "false"     # flip to "true" once it is behind TLS
          envFrom:
            - secretRef:
                name: tableplanner-secrets   # DATABASE_URL, SESSION_SECRET, EDITOR_PASSWORD_HASH
          resources:
            requests:
              memory: 96Mi
              cpu: 50m
            limits:
              # MANDATORY on this box: one unbounded pod takes down everything
              # else. Node idles at 60-80 MB.
              memory: 192Mi
              cpu: 500m
          livenessProbe:
            httpGet: { path: /healthz, port: http }   # no DB touch on purpose
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }    # checks Postgres
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # readOnlyRootFilesystem leaves nothing writable, and Node still
          # wants a /tmp. Without this the pod builds fine and then crashes.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
