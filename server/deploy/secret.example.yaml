# TEMPLATE ONLY - never commit real values, never `kubectl apply` this file.
#
# Seal it first so only the cluster can read it:
#
#   kubectl -n lab create secret generic tableplanner-secrets \
#     --from-literal=DATABASE_URL='postgres://USER:PASS@postgres.data.svc.cluster.local:5432/tableplanner' \
#     --from-literal=SESSION_SECRET='<from npm run hash-password>' \
#     --from-literal=EDITOR_PASSWORD_HASH='<from npm run hash-password>' \
#     --dry-run=client -o yaml \
#   | kubeseal --format yaml > deploy/sealedsecret.yaml
#
#   kubectl apply -f deploy/sealedsecret.yaml
#
# The plaintext never touches a file and never reaches shell history if you
# pipe it as above. Do not echo or cat these values.
apiVersion: v1
kind: Secret
metadata:
  name: tableplanner-secrets
  namespace: lab
type: Opaque
stringData:
  DATABASE_URL: "postgres://USER:PASS@postgres.data.svc.cluster.local:5432/tableplanner"
  SESSION_SECRET: "REPLACE"
  EDITOR_PASSWORD_HASH: "REPLACE"
